name: Template - Build and Push Docker Image

on:
  workflow_call:
    inputs:
      image_name:
        description: 'The name of the image (e.g., high-flyers/ros-core)'
        required: true
        type: string
      dockerfile_path:
        description: 'Path to the Dockerfile'
        required: true
        type: string
      base_tag:
        description: 'The base tag for the image (e.g., latest)'
        required: false
        type: string
        default: latest
      amd64_build:
        description: 'Build for linux/amd64'
        required: false
        type: boolean
        default: true
      arm64_build:
        description: 'Build for linux/arm64'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    if: >-
      (matrix.platform == 'linux/amd64' && inputs.amd64_build) ||
      (matrix.platform == 'linux/arm64' && inputs.arm64_build)
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set PR Tag Suffix
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.head_ref }}"
            SAFE_BRANCH=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
            echo "SUFFIX=-$SAFE_BRANCH" >> $GITHUB_OUTPUT
          else
            echo "SUFFIX=" >> $GITHUB_OUTPUT
          fi

      - name: Set Arch Tag
        id: arch
        run: |
          ARCH="${{ matrix.platform }}"
          ARCH="${ARCH#linux/}"
          echo "arch=${ARCH}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.REGISTRY }}/${{ inputs.image_name }}:${{ inputs.base_tag }}-${{ steps.arch.outputs.arch }}${{ steps.vars.outputs.SUFFIX }}

  manifest:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && inputs.amd64_build && inputs.arm64_build
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ inputs.image_name }}:${{ inputs.base_tag }} \
            ${{ env.REGISTRY }}/${{ inputs.image_name }}:${{ inputs.base_tag }}-amd64 \
            ${{ env.REGISTRY }}/${{ inputs.image_name }}:${{ inputs.base_tag }}-arm64